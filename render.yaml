services:
  - type: web
    name: churn-prediction-api
    env: python
    region: oregon          # free-tier region (change to "frankfurt" for EU)
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
